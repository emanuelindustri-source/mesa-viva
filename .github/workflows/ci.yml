name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tipos, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Pruebas
        run: npm test
      - name: Catálogo i18n
        run: python tools/check_i18n.py
      - name: Build web
        run: npm run build
      - name: Guardar build web
        uses: actions/upload-artifact@v4
        with:
          name: mesa-viva-web
          path: dist
          retention-days: 7
