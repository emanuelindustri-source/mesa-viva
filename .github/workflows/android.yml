name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configurar Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)"
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Dependencias web
        run: npm ci
      - name: Build web
        run: npm run build
        env:
          VITE_ROOM_WS_URL: ${{ vars.VITE_ROOM_WS_URL }}
      - name: Sincronizar assets
        run: npm run android:sync
      - name: Pruebas Kotlin
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon
      - name: Compilar APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
      - name: Renombrar APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/mesa-viva-${GITHUB_REF_NAME#v}-debug.apk
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mesa-viva-debug-apk
          path: artifacts/*.apk
          retention-days: 30
      # La release firmada (APK + AAB + debug) se publica con
      # `python tools/publish_release.py` desde un equipo con el keystore.
      # Este workflow solo valida, compila y adjunta el APK debug como artefacto
      # de Actions para no sobrescribir los binarios firmados de la release.
